[workspace]
resolver = "2"
members = [
    # Phase 1 — Type-level safety toolkit
    "crates/tpt-for-typestate",
    "crates/tpt-for-assert-const",
    # Phase 2 — Design-by-contract core
    "crates/tpt-for-contract",
    # Phase 3 — Contract/typestate extensions
    "crates/tpt-for-witness",
    "crates/tpt-for-refinement",
    # Phase 4 — Verified numerics & algorithms
    "crates/tpt-for-verified-algorithms",
    # Phase 5 — SMT bridge
    "crates/tpt-for-smt-lite",
    # Phase 6 — Proof / testing / simulation / fault-tolerance harnesses
    "crates/tpt-for-proof-ast",
    "crates/tpt-for-det-proptest",
    "crates/tpt-for-deterministic-sim",
    "crates/tpt-for-redundancy",
    "crates/tpt-for-trace-macros",
    "crates/tpt-for-verified-ode",
    # Phase 7 — Ecosystem-gap crates
    "crates/tpt-for-model-check",
    "crates/tpt-for-sat",
    "crates/tpt-for-vcgen",
    "crates/tpt-for-abstract-interp",
    "crates/tpt-for-symbolic-exec",
    "crates/tpt-for-runtime-verify",
]
exclude = []

[workspace.package]
description = "tpt-formal — formal-verification & design-by-contract foundation for TPT Solutions"
authors = ["TPT Solutions"]
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/tpt-solutions/tpt-formal"
repository = "https://github.com/tpt-solutions/tpt-formal"

[workspace.dependencies]
tpt-for-typestate = { version = "0.1.0", path = "crates/tpt-for-typestate" }
tpt-for-assert-const = { version = "0.1.0", path = "crates/tpt-for-assert-const" }
tpt-for-contract = { version = "0.1.0", path = "crates/tpt-for-contract" }
tpt-for-witness = { version = "0.1.0", path = "crates/tpt-for-witness" }
tpt-for-refinement = { version = "0.1.0", path = "crates/tpt-for-refinement" }
tpt-for-verified-algorithms = { version = "0.1.0", path = "crates/tpt-for-verified-algorithms" }
tpt-for-verified-ode = { version = "0.1.0", path = "crates/tpt-for-verified-ode" }
tpt-for-smt-lite = { version = "0.1.0", path = "crates/tpt-for-smt-lite" }
tpt-for-proof-ast = { version = "0.1.0", path = "crates/tpt-for-proof-ast" }
tpt-for-det-proptest = { version = "0.1.0", path = "crates/tpt-for-det-proptest" }
tpt-for-deterministic-sim = { version = "0.1.0", path = "crates/tpt-for-deterministic-sim" }
tpt-for-redundancy = { version = "0.1.0", path = "crates/tpt-for-redundancy" }
tpt-for-trace-macros = { version = "0.1.0", path = "crates/tpt-for-trace-macros" }
tpt-for-model-check = { version = "0.1.0", path = "crates/tpt-for-model-check" }
tpt-for-sat = { version = "0.1.0", path = "crates/tpt-for-sat" }
tpt-for-vcgen = { version = "0.1.0", path = "crates/tpt-for-vcgen" }
tpt-for-abstract-interp = { version = "0.1.0", path = "crates/tpt-for-abstract-interp" }
tpt-for-symbolic-exec = { version = "0.1.0", path = "crates/tpt-for-symbolic-exec" }
tpt-for-runtime-verify = { version = "0.1.0", path = "crates/tpt-for-runtime-verify" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
overflow-checks = true
