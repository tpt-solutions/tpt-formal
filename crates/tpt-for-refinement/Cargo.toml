[package]
name = "tpt-for-refinement"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Refinement types: values carrying a compile-time refinement predicate."

readme = "README.md"
keywords = ["refinement-types", "contract", "dependent-types", "type-level", "predicate"]
categories = ["rust-patterns", "no-std"]

[dependencies]
tpt-for-contract = { workspace = true }

[features]
default = ["std"]
std = []
alloc = []

[lints]
workspace = true

[[example]]
name = "refinement_basic"
path = "examples/basic.rs"

