[package]
name = "tpt-for-witness"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Witness types: values carrying compile-time proof that a predicate holds."

readme = "README.md"
keywords = ["witness", "proof", "phantom-type", "type-level", "dependent-types"]
categories = ["rust-patterns", "no-std"]

[dependencies]
tpt-for-typestate = { workspace = true }

[features]
default = ["std"]
std = []
alloc = []

[lints]
workspace = true

[[example]]
name = "witness_basic"
path = "examples/composed_witnesses.rs"

